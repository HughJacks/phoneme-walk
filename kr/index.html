<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jamo Walk</title>
<style>
  @font-face { font-family: "Protoform"; font-weight: 100; src: url("fonts/Protoform-Thin.woff2") format("woff2"); }
  @font-face { font-family: "Protoform"; font-weight: 300; src: url("fonts/Protoform-Light.woff2") format("woff2"); }
  @font-face { font-family: "Protoform"; font-weight: 500; src: url("fonts/Protoform-Medium.woff2") format("woff2"); }
  :root {
    --bg: #000;
    --fg: #fff;
    --ghost: #6a6a6a;
    --dim: #2e2e2e;
    /* Protoform sits on a 1/3 em grid: jamo are 0.33em wide, tall vowels reach 0.63em,
       a syllable steps down a row for its final (down to -0.33em) */
    --size: clamp(84px, 13vw, 210px);
    --row: 0.75em;        /* candidates in the bag */
    --word-row: 1.15em;   /* the squared word */
  }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; }
  body {
    display: flex; align-items: center; justify-content: center;
    font-family: "Protoform", sans-serif; font-weight: 300;
    font-size: var(--size); line-height: var(--row);
    -webkit-font-smoothing: antialiased; user-select: none; cursor: default;
  }
  body.stacked #line { font-feature-settings: "ss01"; }
  #line { position: relative; display: inline-flex; height: var(--word-row); line-height: var(--word-row); white-space: nowrap; }

  /* the squared word, built as jamo are placed */
  #block { position: relative; display: inline-block; }
  #placed { position: relative; z-index: 1; }
  /* an initial waiting for its vowel: alone it sits on the baseline, in a block it is a row up */
  .lone { position: relative; top: -0.3333em; }

  /* the same walk unsquared, one jamo after another, under the block */
  #trace {
    position: absolute; left: 0; top: 100%; margin-top: 0.22em;
    font-size: 0.36em; line-height: var(--row); color: var(--ghost);
  }
  .chunk { position: relative; display: inline-block; margin-right: 0.1em; transition: margin 400ms ease; }
  .chunk::after {
    content: ""; position: absolute; left: 0.03em; right: 0.03em; bottom: -0.02em;
    height: 1px; background: var(--dim); transition: opacity 400ms ease;
  }
  .chunk.new { animation: in 220ms ease-out; }
  @keyframes in { from { opacity: 0; transform: translateX(-0.06em); } }
  .done .chunk { margin-right: 0; }
  .done .chunk::after { opacity: 0; }
  #trace .real { font-family: "Helvetica Neue", Helvetica, Arial, sans-serif; font-size: 0.3em; letter-spacing: 0.06em; margin-left: 1.2em; vertical-align: middle; }

  /* the bag of possible next jamo: a looping column filling the screen height,
     the selected one sits on the word's line */
  /* top offset puts the selected candidate's baseline on the word's baseline */
  /* Each candidate is drawn where it will go: its row is the whole word squared with the
     candidate added, and a copy of the word without it, in the background colour, on top.
     Protoform builds 가 -> 각 from the same parts in the same places, so the copy hides
     everything but the candidate's own jamo. The selected row is the word's line. */
  #bag { position: absolute; left: 0; top: 0; margin: 0; padding: 0; list-style: none; line-height: var(--word-row); }
  #bag.scrolling { transition: transform 140ms ease; }
  #bag li { height: var(--word-row); }
  #bag .cand { position: relative; display: inline-block; }
  #bag .mask { position: absolute; left: 0; top: 0; color: var(--bg); -webkit-text-stroke: 3px var(--bg); }
  #bag.shuffling li { animation: shuffle 200ms ease-out; }
  @keyframes shuffle { from { opacity: 0; } }

  /* optional info (i): phones under jamo, probabilities beside candidates */
  .info {
    display: none; font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 0.11em; line-height: 1; letter-spacing: 0.04em; color: var(--ghost);
  }
  .chunk .info { position: absolute; left: 0.04em; top: calc(100% + 0.1em); font-size: 0.3em; }
  #bag .info { display: none; margin-left: 0.5em; vertical-align: middle; }
  body.no-trace #trace { display: none; }
  body.show-info .info, body.show-info #bag .info { display: inline-block; }

  /* envelope (shift+E, not listed): width = units looked back, fall-off = how fast they fade.
     Drag across the bars, or [ ] for width and , . for fall-off. */
  #envelope {
    position: fixed; left: 22px; bottom: 22px; display: none; padding: 10px 12px 9px;
    font: 10px/1.3 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.08em; color: #555;
    border: 1px solid #1c1c1c; cursor: crosshair; touch-action: none;
  }
  body.show-envelope #envelope { display: block; }
  #envelope .bars { display: flex; align-items: flex-end; gap: 4px; height: 48px; margin-bottom: 7px; }
  #envelope .bar { width: 12px; background: #3a3a3a; }
  #envelope .bar.off { height: 1px !important; background: #1c1c1c; }
  #envelope .bar.now { background: #777; }
  #hint {
    position: fixed; bottom: 22px; left: 16px; right: 16px; text-align: center;
    font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
    font-size: 12px; line-height: 1.4; letter-spacing: 0.08em; color: #333; transition: opacity 600ms;
  }
  .in-switcher { display: none; }
  body.switcher .in-switcher { display: inline; }
  body.started #hint { opacity: 0; }
  body.started.show-hint #hint { opacity: 1; }
</style>
</head>
<body>
<div id="line"><span id="block"><span id="placed"></span><ul id="bag"></ul></span><div id="trace"></div></div>
<div id="envelope"><div class="bars"></div><div class="text"></div></div>
<div id="hint">space new word &nbsp;·&nbsp; → place &nbsp;·&nbsp; e end &nbsp;·&nbsp; ← undo &nbsp;·&nbsp; ↑ ↓ choose &nbsp;·&nbsp; s shuffle &nbsp;·&nbsp; enter say &nbsp;·&nbsp; u unsquared &nbsp;·&nbsp; d stacked doubles &nbsp;·&nbsp; i info &nbsp;·&nbsp; h keys<span class="in-switcher"> &nbsp;·&nbsp; tab en / kr</span></div>

<script src="model.js"></script>
<script>
const M = window.WALK_MODEL;
const S = M.settings;
const START = M.units.indexOf("START"), END = M.units.indexOf("END");
const BAG_SIZE = 20;
const REAL = new Set(M.real);

// a unit is jamo|phones; the jamo is a conjoining one (ᄀ initial, ᆨ final), shown as
// its compatibility letter (ㄱ) so the word stays unsquared
const jamo = u => M.units[u].split("|")[0];
const letter = u => M.compat[jamo(u)];
const phones = u => (M.units[u].split("|")[1] || "").replace("_", " ");

function table(packed) {
  const t = new Map();
  for (let i = 0; i < packed.length; i += 2) t.set(packed[i], packed[i + 1]);
  return t;
}
function normalise(t) {
  let total = 0;
  for (const v of t.values()) total += v;
  const out = new Map();
  for (const [k, v] of t) out.set(k, v / total);
  return out;
}

// The envelope: how far back the next unit looks, and how fast that influence fades.
// The unit d steps back gets influence falloff^(d-1), d = 1..width. The tables for the last
// k units are blended with weight falloff^(k-1) - falloff^k (the last table, k = width, gets
// falloff^(width-1)), so each unit's total influence is its envelope value. Width 2 with
// falloff = memory is the rule in steps/03_walks/run.py WalkModel.next_probabilities + walk().
const env = { width: 2, falloff: S.memory };
try {
  const saved = JSON.parse(localStorage.getItem("envelope:" + location.pathname));
  if (saved && saved.width >= 1 && saved.width <= M.max_width && saved.falloff >= 0 && saved.falloff <= 1) Object.assign(env, saved);
} catch (e) {}

function contextKey(chain, k) {
  const ids = [];
  for (let i = chain.length - k; i < chain.length; i++) ids.push(i >= 0 ? chain[i] : -1);
  return ids.join(",");
}

function nextProbabilities(chain) {
  const mixed = new Map();
  let shorter = null;
  for (let k = 1; k <= env.width; k++) {
    const t = M.orders[k][contextKey(chain, k)];
    const pk = t ? normalise(table(t)) : shorter;  // unseen context: fall back to the shorter one
    shorter = pk;
    const w = env.falloff ** (k - 1) - (k < env.width ? env.falloff ** k : 0);
    if (!pk || w <= 0) continue;
    for (const [c, v] of pk) mixed.set(c, (mixed.get(c) || 0) + w * v);
  }
  if (!mixed.size) for (const [c, v] of shorter) mixed.set(c, v);  // falloff 1 with an unseen longest context
  let p = new Map();
  for (const [c, m] of mixed) if (m > 0) p.set(c, m ** (1 / S.temperature));
  p = normalise(p);

  const nUnits = chain.filter(u => u !== START).length;
  if (p.has(END) && nUnits < S.min_units && p.size > 1) { p.delete(END); p = normalise(p); }
  if (p.has(END) && nUnits > S.soft_length) {
    p.set(END, p.get(END) * Math.exp(S.end_pressure * (nUnits - S.soft_length)));
    p = normalise(p);
  }
  if (nUnits >= S.max_units) {
    if (p.has(END)) return new Map([[END, 1]]);
    const endShare = c => { const t = table(M.orders[1][c] || []); let s = 0; for (const v of t.values()) s += v; return (t.get(END) || 0) / (s || 1); };
    return new Map([[[...p.keys()].reduce((a, b) => endShare(b) > endShare(a) ? b : a), 1]]);
  }
  return p;
}

// Weighted draw without replacement; the first draw is what a plain random walk would take.
// END is always in the bag (last, if it was not drawn), even where the model gives it 0%.
function drawBag(p, avoid = new Set()) {
  let pool = [...p].filter(([c]) => !avoid.has(c));
  if (pool.length < BAG_SIZE) pool = [...p];  // not enough unseen ones: redraw from everything
  const bag = [];
  while (bag.length < BAG_SIZE && pool.length) {
    let r = Math.random() * pool.reduce((s, [, w]) => s + w, 0);
    let i = 0;
    while (i < pool.length - 1 && (r -= pool[i][1]) > 0) i++;
    bag.push(pool[i][0]);
    pool.splice(i, 1);
  }
  if (!bag.includes(END)) bag.push(END);
  return bag;
}

// state: chain of unit ids starting at START; one bag (and selection) per open step
let chain = null, steps = [];
const done = () => chain && chain[chain.length - 1] === END;
const placed = () => chain ? chain.filter(u => u !== START && u !== END) : [];

// Units keep the jamo's place in the syllable, so every walk squares back into blocks.
const squared = units => units.map(jamo).join("").normalize("NFC");
const isInitial = ch => ch >= "\u1100" && ch <= "\u1112";

// Squared, as far as it goes: an initial still waiting for its vowel cannot compose,
// so it is shown as its letter, raised to where the block will put it.
function squaredHTML(units) {
  const s = squared(units);
  const last = s.slice(-1);
  return isInitial(last) ? s.slice(0, -1) + `<span class="lone">${M.compat[last]}</span>` : s;
}

function openStep() {
  const p = nextProbabilities(chain);
  const bag = drawBag(p);
  steps.push({ p, bag: chain.length > 1 ? bag : bag.filter(u => u !== END), sel: 0 });  // no empty words
}

function newWord() {
  chain = [START];
  steps = [];
  openStep();
  render();
}

// e: end the word here, whatever is selected
function endWord() {
  if (!chain || done() || chain.length < 2) return;
  chain.push(END);
  render(true);
}

function place() {
  if (!chain || done()) return;
  const step = steps[steps.length - 1];
  chain.push(step.bag[step.sel]);
  if (!done()) openStep();
  render(true);
}

function undo() {
  if (!chain || chain.length <= 1) return;
  if (!done()) steps.pop();
  chain.pop();
  render();
}

function move(d) {
  if (!chain || done()) return;
  const step = steps[steps.length - 1];
  const n = step.bag.length;
  step.sel = (step.sel + d + n) % n;
  render(false, false, d);
}

const envelopeBox = document.getElementById("envelope");

function drawEnvelope() {
  // furthest back on the left, the unit just placed on the right
  const bars = [];
  for (let d = M.max_width; d >= 1; d--)
    bars.push(`<div class="bar${d > env.width ? " off" : d === 1 ? " now" : ""}" style="height: ${Math.max(1, 48 * env.falloff ** (d - 1))}px"></div>`);
  envelopeBox.querySelector(".bars").innerHTML = bars.join("");
  envelopeBox.querySelector(".text").textContent = `envelope  ·  width ${env.width}  ·  fall-off ${env.falloff.toFixed(2)}`;
}

function setEnvelope(width, falloff) {
  env.width = Math.min(M.max_width, Math.max(1, Math.round(width)));
  env.falloff = Math.min(1, Math.max(0, Math.round(falloff * 100) / 100));
  try { localStorage.setItem("envelope:" + location.pathname, JSON.stringify(env)); } catch (e) {}
  drawEnvelope();
  // the open step is redrawn under the new envelope; placed units stay
  if (chain && !done()) {
    const step = steps[steps.length - 1];
    step.p = nextProbabilities(chain);
    step.bag = drawBag(step.p);
    step.sel = 0;
    render(false, true);
  }
}

function dragEnvelope(e) {
  const r = envelopeBox.querySelector(".bars").getBoundingClientRect();
  const slot = Math.floor((e.clientX - r.left) / (r.width / M.max_width));  // 0 = furthest back
  setEnvelope(M.max_width - Math.min(M.max_width - 1, Math.max(0, slot)), 1 - (e.clientY - r.top) / r.height);
}
envelopeBox.addEventListener("pointerdown", e => { envelopeBox.setPointerCapture(e.pointerId); dragEnvelope(e); });
envelopeBox.addEventListener("pointermove", e => { if (envelopeBox.hasPointerCapture(e.pointerId)) dragEnvelope(e); });
drawEnvelope();

function shuffle() {
  if (!chain || done()) return;
  const step = steps[steps.length - 1];
  step.bag = drawBag(step.p, new Set(step.bag)).filter(u => chain.length > 1 || u !== END);
  step.sel = 0;
  render(false, true);
}

const placedLayer = document.getElementById("placed");
const trace = document.getElementById("trace");
const bag = document.getElementById("bag");
const line = document.getElementById("line");
const BAG_ROW = 1.15;  // em, as --word-row

function render(justPlaced = false, shuffled = false, scrolled = 0) {
  const units = placed();
  const finished = done();
  line.classList.toggle("done", finished);

  const real = finished && REAL.has(units.map(jamo).join(""));
  trace.innerHTML = units.map((u, i) =>
    `<span class="chunk${justPlaced && i === units.length - 1 && !finished ? " new" : ""}">${letter(u)}` +
    `<span class="info">${phones(u)}</span></span>`).join("") +
    (finished ? "." : "") + (real ? `<span class="real">a real word</span>` : "");

  const step = chain && !finished ? steps[steps.length - 1] : null;
  const word = squaredHTML(units);
  placedLayer.innerHTML = word + (finished ? "." : "");  // an ended word gets its full stop

  if (!step) { bag.innerHTML = ""; return; }
  const n = step.bag.length;
  const rowPx = BAG_ROW * parseFloat(getComputedStyle(line).fontSize);
  const reach = n === 1 ? 0 : Math.ceil(innerHeight / 2 / rowPx) + 1;  // rows above and below the line
  const rows = [];
  for (let o = -reach; o <= reach; o++) {
    const u = step.bag[(((step.sel + o) % n) + n) % n];
    const alpha = o === 0 ? 0.42 : 0.03 + 0.22 * (1 - Math.abs(o) / (reach + 1)) ** 1.6;
    const info = u === END ? "end" : phones(u);
    const added = u === END ? word + "." : squaredHTML([...units, u]);
    rows.push(`<li style="color: rgba(255,255,255,${alpha.toFixed(3)})">` +
      `<span class="cand">${added}<span class="mask">${word}</span></span>` +
      `<span class="info">${info} &nbsp;${((step.p.get(u) || 0) * 100).toFixed(1)}%</span></li>`);
  }
  bag.innerHTML = rows.join("");
  // start where the previous selection was, then glide to the new one
  bag.classList.remove("scrolling", "shuffling");
  bag.style.transform = `translateY(${(-reach + scrolled) * rowPx}px)`;
  if (scrolled) {
    void bag.offsetWidth;
    bag.classList.add("scrolling");
    bag.style.transform = `translateY(${-reach * rowPx}px)`;
  }
  if (shuffled) { void bag.offsetWidth; bag.classList.add("shuffling"); }
}

// Korean voices read the squared spelling (they cannot read loose jamo).
function speak() {
  if (!done() || !window.speechSynthesis) return;
  speechSynthesis.cancel();
  const utterance = new SpeechSynthesisUtterance(squared(placed()));
  utterance.lang = "ko-KR";
  utterance.rate = 0.8;
  const voice = speechSynthesis.getVoices().find(v => v.lang.replace("_", "-").startsWith("ko"));
  if (voice) utterance.voice = voice;
  speechSynthesis.speak(utterance);
}

document.addEventListener("keydown", e => {
  if (e.metaKey || e.ctrlKey || e.altKey || e.isComposing) return;
  const toggle = c => () => document.body.classList.toggle(c);
  document.body.classList.add("started");  // the key list fades after the first key
  if (e.key === "E") { e.preventDefault(); document.body.classList.toggle("show-envelope"); return; }
  const nudge = { "[": [-1, 0], "]": [1, 0], ",": [0, -0.05], ".": [0, 0.05] }[e.key];
  if (nudge && document.body.classList.contains("show-envelope")) {
    e.preventDefault();
    setEnvelope(env.width + nudge[0], env.falloff + nudge[1]);
    return;
  }
  const actions = {
    " ": newWord, ArrowRight: place, ArrowLeft: undo, e: endWord,
    ArrowUp: () => move(-1), ArrowDown: () => move(1),
    s: shuffle, Enter: speak, p: speak, d: toggle("stacked"),
    u: toggle("no-trace"), i: toggle("show-info"), h: toggle("show-hint"),
  };
  const action = actions[e.key];
  if (action) { e.preventDefault(); action(); }
  // inside ../walk/index.html, tab switches between the English and Korean walks
  if (e.key === "Tab" && window.parent !== window) { e.preventDefault(); window.parent.postMessage("switch-language", "*"); }
});
addEventListener("resize", () => render());
newWord();  // there is always a word
if (window.parent !== window) document.body.classList.add("switcher");
document.fonts.ready.then(() => render());
</script>
</body>
</html>
