<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Phoneme Walk</title>
<style>
  /* Both walks stay loaded (each keeps its word); tab shows the other one.
     Hidden with visibility, not display, so the hidden one keeps measuring its layout. */
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; transition: opacity 250ms ease; }
  iframe.off { opacity: 0; visibility: hidden; transition: opacity 250ms ease, visibility 0s 250ms; }
  #label {
    position: fixed; top: 20px; right: 22px; z-index: 1; pointer-events: none;
    font: 11px/1 "Helvetica Neue", Helvetica, Arial, sans-serif; letter-spacing: 0.12em; color: #3a3a3a;
  }
  #label b { font-weight: 400; color: #8a8a8a; }
</style>
</head>
<body>
<iframe id="en" src="en/index.html" title="English chunk walk"></iframe>
<iframe id="kr" src="kr/index.html" title="Korean jamo walk" class="off"></iframe>
<div id="label"></div>
<script>
const frames = { en: document.getElementById("en"), kr: document.getElementById("kr") };
let current = "en";
try { if (localStorage.getItem("walk-language") === "kr") current = "kr"; } catch (e) {}

function show(lang) {
  current = lang;
  for (const [k, frame] of Object.entries(frames)) frame.classList.toggle("off", k !== lang);
  document.getElementById("label").innerHTML =
    ["en", "kr"].map(l => l === lang ? `<b>${l.toUpperCase()}</b>` : l.toUpperCase()).join(" / ");
  frames[lang].focus();
  frames[lang].contentWindow.focus();
  try { localStorage.setItem("walk-language", lang); } catch (e) {}
}

const toggle = () => show(current === "en" ? "kr" : "en");
addEventListener("message", e => { if (e.data === "switch-language") toggle(); });
// before either frame has focus, keys land here
addEventListener("keydown", e => { if (e.key === "Tab") { e.preventDefault(); toggle(); } });
for (const frame of Object.values(frames)) frame.addEventListener("load", () => { if (frame === frames[current]) show(current); });
show(current);
</script>
</body>
</html>
